<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LearnLog</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>

  <body>
    <div class="app-container">
      <!-- 상단 -->
      <header class="header">
        <div>
          <h1>LearnLog</h1>
          <p>나의 공부 기록</p>
        </div>

        <button id="theme-toggle">🌙 다크모드</button>
      </header>

      <!-- 대시보드 -->
      <section class="dashboard-section">
        <h2>대시보드</h2>

        <!-- 공부 시간 요약 -->
        <div class="summary-cards">
          <div class="summary-card">
            <p>오늘 공부 시간</p>
            <strong>90분</strong>
          </div>

          <div class="summary-card">
            <p>이번 주 공부 시간</p>
            <strong>420분</strong>
          </div>

          <div class="summary-card">
            <p>총 공부 시간</p>
            <strong>1,240분</strong>
          </div>
        </div>

        <!-- 과목별 공부 시간 -->
        <div class="subject-chart">
          <h3>과목별 공부 시간</h3>

          <div class="chart-row">
            <span class="chart-label"> Python </span>

            <div class="chart-track">
              <div class="chart-bar" style="width: 80%"></div>
            </div>

            <span class="chart-value"> 300분 </span>
          </div>

          <div class="chart-row">
            <span class="chart-label"> Flask </span>

            <div class="chart-track">
              <div class="chart-bar" style="width: 50%"></div>
            </div>

            <span class="chart-value"> 180분 </span>
          </div>

          <div class="chart-row">
            <span class="chart-label"> MySQL </span>

            <div class="chart-track">
              <div class="chart-bar" style="width: 35%"></div>
            </div>

            <span class="chart-value"> 120분 </span>
          </div>
        </div>
      </section>

      <!-- 아래쪽 메인 영역 -->
      <div class="content-grid">
        <!-- 왼쪽 : 공부 기록 -->
        <main class="study-section">
          <h2>공부 기록</h2>

          <!-- JS가 DB 공부 기록을 여기에 넣음 -->
          <div id="study-list" class="study-list"></div>
        </main>

        <!-- 오른쪽 -->
        <aside class="side-panel">
          <!-- 공부 기록 추가 -->
          <section id="study-form">
            <h2>공부 기록 추가</h2>

            <label>
              날짜

              <input id="study-date" type="date" />
            </label>

            <label>
              과목

              <select id="study-subject">
                <option>Python</option>
                <option>MySQL</option>
                <option>Flask</option>
              </select>
            </label>

            <label>
              공부 시간

              <input id="study-minute" type="number" />
            </label>

            <label>
              내용

              <input id="study-content" type="text" />
            </label>

            <button id="study-submit">등록</button>
          </section>

          <!-- 과목 관리 -->
          <section class="subject-section" id="subject-management">
            <h2>과목 관리</h2>

            <div class="subject-item">
              <span>Python</span>

              <div>
                <button>수정</button>

                <button class="delete-button">삭제</button>
              </div>
            </div>

            <div class="subject-add">
              <input type="text" placeholder="새 과목" />

              <button>추가</button>
            </div>
          </section>
        </aside>
      </div>
    </div>

    <footer class="footer">
      <p>© 2026 LearnLog by aranparrk.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
